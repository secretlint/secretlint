name: Profile and benchmark
# Profile and benchmark the base and the head of a pull request on fixed sets of files,
# One job runs for each set, and the summary job puts the results of all sets in one job summary.
# See docs/products/secretlint/features/change-comparison/
#
# This workflow runs the code of the pull request, including a pull request from a fork.
# Do not change it to pull_request_target, and do not give it secrets or write permissions.
on:
  pull_request:
    paths:
      - "packages/**"
      - "examples/benchmark/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/profile-benchmark.yml"
      - "!**/*.md"
permissions:
  contents: read
env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
jobs:
  compare:
    name: "${{ matrix.set }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        set: [small, medium, large, huge]
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .node-version
      - name: Install hyperfine
        run: sudo apt-get update && sudo apt-get install -y hyperfine
      - name: Profile and benchmark the base and the head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          SET: ${{ matrix.set }}
        # The Markdown goes to the log; the summary job puts all sets in the job summary
        run: node examples/benchmark/compare.mjs --base "$BASE_SHA" --set "$SET" --json "compare-$SET.json"
      - name: Upload the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: profile-benchmark-${{ matrix.set }}
          path: compare-${{ matrix.set }}.json
          if-no-files-found: error
  summary:
    name: summary
    needs: compare
    # Show the sets that finished, even when a set failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version-file: .node-version
      - name: Download the results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: profile-benchmark-*
          path: results
          merge-multiple: true
      - name: Put all sets in the job summary
        run: |
          shopt -s nullglob
          args=()
          for file in results/compare-*.json; do
            args+=(--render "$file")
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "No set has a result. See the jobs of the sets." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node examples/benchmark/compare.mjs "${args[@]}" >> "$GITHUB_STEP_SUMMARY"
          missing=()
          for set in small medium large huge; do
            [ -f "results/compare-$set.json" ] || missing+=("$set")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf "\n⚠️ No result for: %s. See the jobs of these sets.\n" "${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
          fi
