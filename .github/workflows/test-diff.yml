name: test-diff
on:
  push:
  pull_request:
jobs:
  test-diff:
    permissions:
      contents: read
    name: "Run secretlint to diff files"
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1000
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          quotepath: "false"
      - name: setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: 'pnpm'
      - name: Show changed files
        run: echo "${STEPS_CHANGED_FILES_OUTPUTS_ALL_CHANGED_FILES}"
        env:
          STEPS_CHANGED_FILES_OUTPUTS_ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
      - name: Install
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pnpm install
      - name: Build
        if: steps.changed-files.outputs.any_changed == 'true'
        run: pnpm run build
      - name: Run secretlint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          # Set NODE_PATH to help module resolution with pnpm
          export NODE_PATH="${PWD}/node_modules/.pnpm/node_modules"
          node packages/secretlint/bin/secretlint.js ${STEPS_CHANGED_FILES_OUTPUTS_ALL_CHANGED_FILES}
        env:
          STEPS_CHANGED_FILES_OUTPUTS_ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}